aid: koska
name: Koska
description: >-
  KOSKA Corporation (株式会社KOSKA) is a Tokyo-based manufacturing technology
  company, founded in October 2018, that applies cost accounting and IoT to the
  Japanese factory floor. Its flagship product GenKan (原価管理自動化サービス) automates
  cost management for high-mix low-volume manufacturers: RFID and power sensors
  installed on existing equipment capture work progress and consumption without
  changing operator behavior, then make processing cost, material cost, and
  electricity cost visible line by line, feeding real actual-cost figures and KPI
  setting back to the shop floor and management. A second product, ながら記録
  (Nagara Kiroku / "vScribe"), is an AI record-keeping app for manufacturing,
  construction, and logistics sites — photograph a paper form and AI generates
  the input form, then operators record hands-free by speaking, with the AI
  parsing natural speech into structured records, inspections, and reports. KOSKA
  is led by CEO Kenichiro Sone (Forbes 30 Under 30 Asia 2021) and advised by
  Hiroshi Obata, former chair of the Japan Cost Accounting Association. As of
  this profile the company publishes no public developer API, SDK, or developer
  portal — it is a sensor-and-SaaS product company, not an API provider.
